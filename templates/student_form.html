{% extends 'base.html' %}

{% block title %}{{ action }} Student - CGPA System{% endblock %}

{% block content %}
<div class="container">
    <div class="dashboard-header">
        <h1>{{ action }} Student</h1>
    </div>

    <div class="panel" style="max-width: 600px; margin: 0 auto;">
        <form method="post" class="form-stack">
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" placeholder="e.g., STD-1003" required>
            </div>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g., John Doe" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ action }} Student</button>
            <a href="{{ url_for('dashboard') }}" class="btn" style="background: #95a5a6; color: white; text-align: center; text-decoration: none;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
