{% extends 'base.html' %}

{% block title %}Login - CGPA System{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h1>Student CGPA System</h1>
        <p class="subtitle">Academic Performance Management</p>

        <form method="post" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="demo-creds">
            <h4>Demo Credentials</h4>
            <div class="cred-row"><span class="role">Admin:</span> <span class="user">admin / admin123</span></div>
            <div class="cred-row"><span class="role">Teacher:</span> <span class="user">teacher / teacher123</span></div>
            <div class="cred-row"><span class="role">Student:</span> <span class="user">student / student123</span></div>
        </div>
    </div>
</div>
{% endblock %}
